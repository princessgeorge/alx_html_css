<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Our results — Pentagons (CSS only)</title>
  <link rel="stylesheet" href="6-styles.css" />
</head>
<body>
  <main>
    <section class="our-result">
      <div class="container">
        <h2 class="section-title">Our results</h2>
        <p class="section-intro">
          These pentagons are drawn with HTML &amp; CSS (no image files). Resize the
          browser to see responsive behaviour.
        </p>

        <div class="our-result-imgs" aria-hidden="false">
          <!-- Example pentagons -->
          <div class="pentagon" role="img" aria-label="Result 1: 95% satisfaction">
            <div class="pentagon-inner">
              <span class="pentagon-value">95%</span>
              <span class="pentagon-label">Satisfaction</span>
            </div>
          </div>

          <div class="pentagon" role="img" aria-label="Result 2: 4.8 rating">
            <div class="pentagon-inner">
              <span class="pentagon-value">4.8</span>
              <span class="pentagon-label">Rating</span>
            </div>
          </div>

          <div class="pentagon" role="img" aria-label="Result 3: Fast delivery">
            <div class="pentagon-inner">
              <span class="pentagon-value">FAST</span>
              <span class="pentagon-label">Delivery</span>
            </div>
          </div>

          <div class="pentagon" role="img" aria-label="Result 4: Eco friendly">
            <div class="pentagon-inner">
              <span class="pentagon-value">ECO</span>
              <span class="pentagon-label">Friendly</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
